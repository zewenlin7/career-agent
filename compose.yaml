services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career_local_only
      POSTGRES_DB: career_agent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_agent"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
