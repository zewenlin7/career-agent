[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-agent"
version = "0.1.0a1"
description = "Single-user Career Agent foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires real PostgreSQL and creates a temporary database"]
